[project]
name = "homescout-generator"
version = "0.0.0"
description = "Reads the fixtures, calls the cost engine and writes costs.json (decision 0039)."
requires-python = ">=3.14"
dependencies = [
    "homescout-engine",
    "psycopg==3.3.6",
]

[tool.uv.sources]
homescout-engine = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
