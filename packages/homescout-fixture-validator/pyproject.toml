[project]
name = "homescout-fixture-validator"
version = "0.0.0"
description = "Checks the fixture files against their JSON Schemas; never depends on the cost engine (decision 0039)."
requires-python = ">=3.14"
dependencies = ["jsonschema>=4.26,<5", "referencing>=0.37,<0.38"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
