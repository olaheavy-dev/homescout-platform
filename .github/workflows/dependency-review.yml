name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Zlib, Unlicense, CC0-1.0, MPL-2.0
          # The dependency-submission workflow supplies NuGet data; retry while its snapshot is still arriving.
          retry-on-snapshot-warnings: true
          # Recorded exception (decision 0035): JetBrains ReSharper command line tools, a free proprietary-licence
          # build tool that is used but never shipped.
          allow-dependencies-licenses: pkg:nuget/JetBrains.ReSharper.GlobalTools
