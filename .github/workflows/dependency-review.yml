name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Zlib, Unlicense, CC0-1.0, MPL-2.0, zlib-acknowledgement, PSF-2.0
          # typing_extensions: PSF-2.0 is on the allow-list (decision 0049 item 7), but GitHub reported its licence as a
          # Python-2.0/GPL-1.0-or-later expression on 9 Nov 2026, so the package is also named here as a safeguard.
          # Recorded exception (decision 0027, register line BE-22): libcst, Apache-2.0 AND MIT AND Python-2.0 per GitHub
          # (its LICENSE is MIT plus files derived from the Python standard library and from dataclasses); dev-only via
          # mutmut, never imported or shipped.
          # Vestagraph's own packages (all rights reserved; register line BE-22): GitHub's uv.lock parser lists the
          # repository-local uv projects as PyPI dependencies with no licence. Each new package of ours (the API at #93,
          # the MCP server at #97) needs an entry here.
          allow-dependencies-licenses: pkg:pypi/typing-extensions, pkg:pypi/libcst, pkg:pypi/vestagraph-engine, pkg:pypi/vestagraph-generator, pkg:pypi/vestagraph-fixture-validator


      # The action prints packages with no detectable licence but does not fail on them (issue #30). Decision 0027 does
      # not allow them, so fail here, listing each one. The output is passed through `env`, never into the script text.
      - name: Fail on packages with no detectable licence (decision 0027, issue #30)
        if: ${{ !cancelled() && steps.review.outputs.invalid-license-changes != '' }}
        env:
          INVALID: ${{ steps.review.outputs.invalid-license-changes }}
        run: |
          # A parse error makes jq fail, and `bash -e` then fails the step (an `if jq -e` would treat it as "none").
          n=$(jq '.unlicensed | length' <<<"$INVALID")
          if [ "$n" -gt 0 ]; then
            jq -r '.unlicensed[] | "\(.manifest) » \(.name)@\(.version)"' <<<"$INVALID"
            exit 1
          fi
