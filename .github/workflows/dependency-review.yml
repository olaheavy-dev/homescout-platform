name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Zlib, Unlicense, CC0-1.0, MPL-2.0, zlib-acknowledgement
          # The dependency-submission workflow supplies NuGet data; retry while its snapshot is still arriving.
          retry-on-snapshot-warnings: true
          # Recorded exception (decision 0035): JetBrains ReSharper command line tools, a free proprietary-licence
          # build tool that is used but never shipped.
          # Recorded exception (founder decision, 23 Oct 2026, register line BE-08): JsonSchema.Net 9.x and its two
          # dependencies ship under the Open Source Maintenance Fee EULA. The source stays MIT; the fee applies only to
          # binary-release use in revenue-generating activities with US$10,000 or more annual revenue. Used by the fixture
          # validator only, never shipped.
          # Recorded exception (decision 0027, register line BE-09): NetArchTest.Rules 1.3.2 and its dependency Mono.Cecil
          # are MIT per their GitHub repositories, but their NuGet metadata declares no SPDX licence, so the unlicensed
          # step below would fail them. Used by the architecture tests only, never shipped; removed with the C# (P6).
          # Recorded exception (decision 0039 section 7): typing_extensions, PSF-2.0, tool-only, never imported or shipped;
          # GitHub reports its licence as a Python-2.0/GPL-1.0-or-later expression.
          allow-dependencies-licenses: pkg:nuget/JetBrains.ReSharper.GlobalTools, pkg:nuget/JsonSchema.Net, pkg:nuget/JsonPointer.Net, pkg:nuget/Json.More.Net, pkg:nuget/NetArchTest.Rules, pkg:nuget/Mono.Cecil, pkg:pypi/typing-extensions

      # The action prints packages with no detectable licence but does not fail on them (issue #30). Decision 0027 does
      # not allow them, so fail here, listing each one. The output is passed through `env`, never into the script text.
      - name: Fail on packages with no detectable licence (decision 0027, issue #30)
        if: ${{ !cancelled() && steps.review.outputs.invalid-license-changes != '' }}
        env:
          INVALID: ${{ steps.review.outputs.invalid-license-changes }}
        run: |
          if jq -e '.unlicensed | length > 0' <<<"$INVALID" >/dev/null; then
            jq -r '.unlicensed[] | "\(.manifest) » \(.name)@\(.version)"' <<<"$INVALID"
            exit 1
          fi
