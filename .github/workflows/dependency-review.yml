name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Zlib, Unlicense, CC0-1.0, MPL-2.0
          # Recorded exceptions (decision 0035): build and test tools that are used but never shipped.
          # JetBrains ReSharper command line tools: free proprietary licence.
          # Microsoft code-coverage extension: Microsoft software licence terms, test projects only.
          allow-dependencies-licenses: pkg:nuget/JetBrains.ReSharper.GlobalTools, pkg:nuget/Microsoft.Testing.Extensions.CodeCoverage
