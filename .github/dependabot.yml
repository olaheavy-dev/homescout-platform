version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      nuget-major:
        update-types:
          - "major"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # 0.x tools (ruff, referencing): a minor bump may break things, so it goes to full review, not into the
      # minor-and-patch group (decision 0039 Q3). GitHub's options reference says a dependency goes into the first
      # group it matches; check the first real run. That reference lists uv 0.11 as the supported version while
      # pyproject.toml requires uv 0.13.7 or later: check that the first uv job can update uv.lock.
      python-zero-x:
        patterns:
          - "ruff"
          - "referencing"
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      python-major:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # 0.x tools: a minor bump may break things, so each is its own group and goes to review (decision 0039 Q3).
      actions-zero-x:
        patterns:
          - "zizmorcore/zizmor-action"
          - "advanced-security/component-detection-dependency-submission-action"
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      actions-major:
        update-types:
          - "major"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dotnet-sdk-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      dotnet-sdk-major:
        update-types:
          - "major"
